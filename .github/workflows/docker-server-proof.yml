# Build Dockerfile.server and run insole slice proof vs Cura reference G-code.
# Railway config is present but this workflow does not deploy.
name: Docker server proof

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'Dockerfile.server'
      - 'server/**'
      - 'scripts/docker_headless_slice_proof.sh'
      - 'validation/**'
      - 'resources/profiles/IdeaFormer/**'
      - 'tools/belt_pp/**'
      - 'scripts/g2b_heelmod/**'
      - 'scripts/golden_gate.py'
      - 'scripts/golden_chain_proof.py'
      - '.github/workflows/docker-server-proof.yml'
      - 'src/**'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.server'
      - 'server/**'

concurrency:
  group: docker-server-proof-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # cache-to type=gha writes the Actions cache. packages: read pulls the
  # published headless image used as a registry cache seed.
  actions: write
  packages: read

env:
  REGISTRY: ghcr.io
  HEADLESS_IMAGE: ghcr.io/kdho77/vertexslice-server:headless

jobs:
  # This is the in-image slice proof. Earlier passing/failing runs on this
  # draft PR were pull_request synchronize; do not draft-skip it (006ae211
  # gated other expensive jobs). workflow_dispatch also stays enabled.
  docker_proof:
    name: Build image and run slice proof
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'true'

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published headless image (cache seed)
        continue-on-error: true
        run: docker pull "${{ env.HEADLESS_IMAGE }}"

      # ccache lives outside the build context so a warm cache does not bust
      # COPY . The mount target must stay /ccache, matching Dockerfile.server.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: vertexslice-proof-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            vertexslice-proof-ccache-${{ runner.os }}-

      - name: Inject ccache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          scratch-dir: ${{ runner.temp }}/cache-dance-scratch
          cache-map: |
            {
              "${{ runner.temp }}/ccache": "/ccache"
            }

      - name: Build server image (proof runs in Dockerfile RUN)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          target: runtime
          builder: ${{ steps.setup-buildx.outputs.name }}
          tags: vertexslice-server:proof
          load: true
          push: false
          cache-from: |
            type=gha,scope=vertexslice-server-headless
            type=registry,ref=${{ env.HEADLESS_IMAGE }},ignore-error=true
          cache-to: type=gha,mode=max,scope=vertexslice-server-headless

      - name: Extract orca-slicer from image
        run: |
          cid=$(docker create vertexslice-server:proof)
          docker cp "$cid:/app/bin/orca-slicer" ./orca-slicer
          docker rm "$cid"
          sha256sum orca-slicer | tee orca-slicer.sha256

      - name: Upload orca-slicer binary
        uses: actions/upload-artifact@v5
        with:
          name: orca-slicer-${{ github.sha }}
          path: orca-slicer
          retention-days: 7

      - name: Re-run proof script (capture JSON for logs)
        run: |
          docker run --rm \
            -e VERTEXSLICE_API_KEY=ci-proof \
            vertexslice-server:proof \
            /app/scripts/docker_headless_slice_proof.sh | tee docker-proof.json
          docker image inspect vertexslice-server:proof --format 'image_size_bytes={{.Size}}'

      - name: Upload proof report
        uses: actions/upload-artifact@v5
        with:
          name: docker-server-proof
          path: docker-proof.json
          if-no-files-found: error
          retention-days: 14

      - name: Golden chain gate
        run: |
          set +e
          mount=()
          if [ -n "${VS_GOLDEN_DIR:-}" ]; then
            mount=(-e VS_GOLDEN_DIR=/goldens -v "${VS_GOLDEN_DIR}:/goldens:ro")
          fi
          docker run --rm -e APEX_MIN_LAYER_TIME=4 "${mount[@]}" \
            vertexslice-server:proof \
            python3 /app/scripts/golden_chain_proof.py
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            echo "golden_gate diff_count != 0"
            exit 1
          fi
          if [ "$status" -eq 2 ]; then
            echo "LOCKED goldens were not fetched into this job (they are not committed)."
            echo "Missing input is not a diff. A mounted VS_GOLDEN_DIR that diffs fails this job."
            exit 0
          fi
          exit "$status"

      # >>> INSIDE-ONLY GATES (FROZEN: paste unchanged immediately after the Golden chain gate step and before validation_unit:; the PM verifies this text byte for byte) >>>
      - name: Inside-only gates 1/4 - repo guard (file allow-list, MUST-MATCH shas, additive workflow)
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          git fetch --no-tags --depth=1 origin b7e90bd1eb5b92d83e57ccf8213b680588d5c37f "$HEAD_SHA"
          echo "73c139ccf65261d79cd7f28945ba7da8485bc352ece4aefed403bb2a30336dc0  validation/repo_guard.sh" | sha256sum -c -
          bash validation/repo_guard.sh b7e90bd1eb5b92d83e57ccf8213b680588d5c37f "$HEAD_SHA"

      - name: Inside-only gates 2/4 - slice LIVE image and candidate image through POST /v1/slice
        run: |
          set -euo pipefail
          mkdir -p gate_out
          echo "1bfbf6c612863d3514c9c80932a947a4e895a9cd4bd52138b379cded5f9bed4d  validation/run_inside_only_gates.sh" | sha256sum -c -
          docker pull "ghcr.io/kdho77/vertexslice-server@sha256:dd5127f59f5acc9674ae0bc5e48705432481db5d61f23cb8c90b4e0c0cbf1fa4"
          docker rm -f vs_live vs_cand 2>/dev/null || true
          docker run -d --name vs_live -p 18081:8080 "ghcr.io/kdho77/vertexslice-server@sha256:dd5127f59f5acc9674ae0bc5e48705432481db5d61f23cb8c90b4e0c0cbf1fa4"
          docker run -d --name vs_cand -p 18082:8080 vertexslice-server:proof
          for port in 18081 18082; do
            ok=0
            for i in $(seq 1 90); do
              if curl -fsS "http://127.0.0.1:${port}/health" >/dev/null 2>&1; then ok=1; break; fi
              sleep 2
            done
            [ "$ok" = 1 ] || { echo "server on ${port} did not become healthy"; exit 1; }
          done
          for who in live:18081 cand:18082; do
            for mat in apex_core apex_light; do
              for stl in orthocad:orthocad_sample_top_insole insole2:insole_sample; do
                curl -sS -f -m 900 -D "gate_out/${who%%:*}_${mat}_${stl%%:*}.hdr" -o "gate_out/${who%%:*}_${mat}_${stl%%:*}.gcode" \
                  -F profile_id=apex-v2-insole-95a -F "model=@validation/test_models/${stl##*:}.stl" \
                  -F wall_loops=1 -F infill_density=26 -F print_direction=toe_first -F belt_insole_place=true -F "material=${mat}" \
                  "http://127.0.0.1:${who##*:}/v1/slice"
              done
            done
          done
          docker rm -f vs_live vs_cand

      - name: Inside-only gates 3/4 - run every frozen gate on every live/candidate pair
        run: |
          set -euo pipefail
          python3 -m venv .gatevenv
          . .gatevenv/bin/activate
          python -m pip install -q numpy shapely
          bash validation/run_inside_only_gates.sh gate_out

      - name: Inside-only gates 4/4 - upload slices and gate results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: inside-only-gates-${{ github.sha }}
          path: gate_out
          if-no-files-found: error
          retention-days: 14
      # <<< INSIDE-ONLY GATES (FROZEN) <<<

  validation_unit:
    name: Validation scripts (no binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: 'true'
      # ubuntu-latest is 26.04 and its Python has no wheel for manifold3d
      # 2.5.1. Pip then builds it, and current scikit-build-core rejects that
      # release's cmake.minimum-version key. 3.12 has wheels for every pin.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Registry + Cura ref tests
        run: |
          python -m pip install -q -r server/requirements.txt httpx
          python validation/tests/test_server_registry.py
          python validation/tests/test_server_slice_overrides.py
          python validation/tests/test_materials.py
          python validation/tests/test_apex_light.py
          python validation/tests/test_apex_v2_insole_densities.py
          python validation/tests/test_apex_v2_cura_match.py
          python validation/tests/test_apex_v2_slice.py
          python validation/tests/test_apex_v2_gcode_bookends.py
          python validation/tests/test_first_layer_y.py
          python validation/tests/test_print_direction_tunables.py
          python -m unittest tests.test_server_full_chain tests.test_golden_gate tests.test_threemf_modifiers tests.test_region_infill -v
