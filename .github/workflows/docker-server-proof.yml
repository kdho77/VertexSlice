# Build Dockerfile.server and run insole slice proof vs Cura reference G-code.
# Railway config is present but this workflow does not deploy.
name: Docker server proof

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'Dockerfile.server'
      - 'server/**'
      - 'scripts/docker_headless_slice_proof.sh'
      - 'validation/**'
      - 'resources/profiles/IdeaFormer/**'
      - 'tools/belt_pp/**'
      - 'scripts/g2b_heelmod/**'
      - 'scripts/golden_gate.py'
      - 'scripts/golden_chain_proof.py'
      - '.github/workflows/docker-server-proof.yml'
      - 'src/**'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.server'
      - 'server/**'

concurrency:
  group: docker-server-proof-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # cache-to type=gha writes the Actions cache. packages: read pulls the
  # published headless image used as a registry cache seed.
  actions: write
  packages: read

env:
  REGISTRY: ghcr.io
  HEADLESS_IMAGE: ghcr.io/kdho77/vertexslice-server:headless

jobs:
  # This is the in-image slice proof. Earlier passing/failing runs on this
  # draft PR were pull_request synchronize; do not draft-skip it (006ae211
  # gated other expensive jobs). workflow_dispatch also stays enabled.
  docker_proof:
    name: Build image and run slice proof
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'true'

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published headless image (cache seed)
        continue-on-error: true
        run: docker pull "${{ env.HEADLESS_IMAGE }}"

      # ccache lives outside the build context so a warm cache does not bust
      # COPY . The mount target must stay /ccache, matching Dockerfile.server.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: vertexslice-proof-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            vertexslice-proof-ccache-${{ runner.os }}-

      - name: Inject ccache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          scratch-dir: ${{ runner.temp }}/cache-dance-scratch
          cache-map: |
            {
              "${{ runner.temp }}/ccache": "/ccache"
            }

      - name: Build server image (proof runs in Dockerfile RUN)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          target: runtime
          builder: ${{ steps.setup-buildx.outputs.name }}
          tags: vertexslice-server:proof
          load: true
          push: false
          cache-from: |
            type=gha,scope=vertexslice-server-headless
            type=registry,ref=${{ env.HEADLESS_IMAGE }},ignore-error=true
          cache-to: type=gha,mode=max,scope=vertexslice-server-headless

      - name: Extract orca-slicer from image
        run: |
          cid=$(docker create vertexslice-server:proof)
          docker cp "$cid:/app/bin/orca-slicer" ./orca-slicer
          docker rm "$cid"
          sha256sum orca-slicer | tee orca-slicer.sha256

      - name: Upload orca-slicer binary
        uses: actions/upload-artifact@v5
        with:
          name: orca-slicer-${{ github.sha }}
          path: orca-slicer
          retention-days: 7

      - name: Re-run proof script (capture JSON for logs)
        run: |
          docker run --rm \
            -e VERTEXSLICE_API_KEY=ci-proof \
            vertexslice-server:proof \
            /app/scripts/docker_headless_slice_proof.sh | tee docker-proof.json
          docker image inspect vertexslice-server:proof --format 'image_size_bytes={{.Size}}'

      - name: Upload proof report
        uses: actions/upload-artifact@v5
        with:
          name: docker-server-proof
          path: docker-proof.json
          if-no-files-found: error
          retention-days: 14

      - name: Golden chain gate
        run: |
          set +e
          mount=()
          if [ -n "${VS_GOLDEN_DIR:-}" ]; then
            mount=(-e VS_GOLDEN_DIR=/goldens -v "${VS_GOLDEN_DIR}:/goldens:ro")
          fi
          docker run --rm -e APEX_MIN_LAYER_TIME=4 "${mount[@]}" \
            vertexslice-server:proof \
            python3 /app/scripts/golden_chain_proof.py
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            echo "golden_gate diff_count != 0"
            exit 1
          fi
          if [ "$status" -eq 2 ]; then
            echo "LOCKED goldens were not fetched into this job (they are not committed)."
            echo "Missing input is not a diff. A mounted VS_GOLDEN_DIR that diffs fails this job."
            exit 0
          fi
          exit "$status"

  # Frozen handedness gates H1-H3. Additive: the jobs above are unchanged.
  # LIVE is the published server image of origin/main d935197976. CANDIDATE is
  # that image plus this branch's belt placement (validation/stl_preprocess.py
  # and server/threemf_modifiers.py). src/ is unchanged, so the slicer binary
  # matches LIVE. The gateway-timeout overlay is the slice_all.sh approach,
  # applied only inside the throwaway containers.
  handedness_gates:
    name: Handedness gates H1-H3
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'true'

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate and slice gate inputs
        run: |
          set -euo pipefail
          LIVE="ghcr.io/kdho77/vertexslice-server@sha256:8cac1d54c5e1a12f4693412c32fe40dd9c5682b9279e2b1d38f1225760aca579"
          docker pull "$LIVE"
          root="$RUNNER_TEMP/handedness"
          rm -rf "$root"
          mkdir -p "$root/cand/validation" "$root/cand/server" "$RUNNER_TEMP/slices"
          cp validation/stl_preprocess.py "$root/cand/validation/stl_preprocess.py"
          cp server/threemf_modifiers.py "$root/cand/server/threemf_modifiers.py"
          cat > "$root/cand.Dockerfile" << 'EOF'
          FROM live-base
          COPY validation/stl_preprocess.py /app/validation/stl_preprocess.py
          COPY server/threemf_modifiers.py /app/server/threemf_modifiers.py
          EOF
          sed -i 's/^          //' "$root/cand.Dockerfile"
          docker tag "$LIVE" live-base
          docker build -f "$root/cand.Dockerfile" -t vertexslice-server:cand "$root/cand"
          python3 - << 'PY'
          import os
          import struct
          from pathlib import Path
          src = Path("validation/test_models/orthocad_sample_top_insole.stl")
          data = src.read_bytes()
          n = struct.unpack_from("<I", data, 80)[0]
          if data[:5].lower() == b"solid" or 84 + n * 50 != len(data):
              raise SystemExit(f"{src} is not the expected binary STL (tris={n} bytes={len(data)})")
          out = bytearray(data[:84])
          for i in range(n):
              base = 84 + i * 50
              vals = struct.unpack_from("<12f", data, base)
              # Y negated and triangle winding reversed (v1, v2, v3) -> (v3, v2, v1).
              mirrored = (0.0, 0.0, 1.0, vals[9], -vals[10], vals[11], vals[6], -vals[7], vals[8], vals[3], -vals[4], vals[5])
              out += struct.pack("<12f", *mirrored)
              out += data[base + 48 : base + 50]
          dest = Path(os.environ["RUNNER_TEMP"]) / "slices" / "right_input.stl"
          dest.write_bytes(out)
          print(f"RIGHT stl tris={n} bytes={dest.stat().st_size}")
          PY
          # Gateway timeout overlay copied from validation/seam_fuse_gates/slice_all.sh.
          # server/app.py hard-codes SLICE_GATEWAY_TIMEOUT_S = 260. The copy is
          # bind-mounted into the test container only; the repo, images, and
          # production are not changed. The same overlay is applied to both images.
          KEY=gate-local-key
          OUT="$RUNNER_TEMP/slices"
          LEFT="$GITHUB_WORKSPACE/validation/test_models/orthocad_sample_top_insole.stl"
          RIGHT="$OUT/right_input.stl"
          port=18080
          for spec in "cand=vertexslice-server:cand" "live=$LIVE"; do
            tag=${spec%%=*}; img=${spec#*=}
            port=$((port + 1)); name="hand_${tag}"
            docker rm -f "$name" >/dev/null 2>&1 || true
            ov="$OUT/.overlay_${tag}"; mkdir -p "$ov"
            cid=$(docker create "$img")
            docker cp "$cid:/app/server/app.py" "$ov/app.py"
            docker rm "$cid" >/dev/null
            n=$(grep -c '^SLICE_GATEWAY_TIMEOUT_S = 260$' "$ov/app.py" || true)
            [ "$n" = 1 ] || { echo "app.py in $img does not have exactly one 'SLICE_GATEWAY_TIMEOUT_S = 260' line ($n); stop"; exit 3; }
            sed -i 's/^SLICE_GATEWAY_TIMEOUT_S = 260$/SLICE_GATEWAY_TIMEOUT_S = 880  # test-harness overlay only (handedness gates)/' "$ov/app.py"
            docker run -d --name "$name" -p "$port:8080" -e VERTEXSLICE_API_KEY="$KEY" \
              -v "$(cd "$ov" && pwd)/app.py:/app/server/app.py:ro" "$img" >/dev/null
            ok=0
            for i in $(seq 1 120); do
              curl -fsS "http://127.0.0.1:$port/health" >/dev/null 2>&1 && { ok=1; break; }
              sleep 2
            done
            [ "$ok" = 1 ] || { echo "server $tag did not become healthy"; docker logs "$name" | tail -30; exit 1; }
            mapfile -t mats < <(curl -fsS -H "X-API-Key: $KEY" "http://127.0.0.1:$port/v1/materials" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); ids=[m["id"] if isinstance(m, dict) else m for m in d["materials"]]; print("\n".join(ids))')
            echo "$tag materials: ${mats[*]}"
            want=()
            for mat in apex_core apex_light; do
              printf '%s\n' "${mats[@]}" | grep -qx "$mat" || { echo "server $tag does not list $mat"; exit 1; }
              want+=("$mat")
            done
            for mat in apex_forge apex_bounce; do
              printf '%s\n' "${mats[@]}" | grep -qx "$mat" && want+=("$mat") || echo "$tag skip $mat (not listed)"
            done
            slice_one() {
              local mat=$1 side=$2 stl=$3 direction=$4 outname=$5 required=$6
              local f="$OUT/${outname}"
              local t0 code
              t0=$(date +%s)
              code=$(curl -sS -m 900 -w '%{http_code}' -D "$f.hdr" -o "$f.gcode" -H "X-API-Key: $KEY" \
                -F profile_id=apex-v2-insole-95a -F "model=@${stl}" \
                -F wall_loops=1 -F infill_density=26 -F "print_direction=${direction}" \
                -F belt_insole_place=true -F "material=${mat}" \
                "http://127.0.0.1:${port}/v1/slice") || code=000
              local bytes
              bytes=$(stat -c %s "$f.gcode" 2>/dev/null || echo 0)
              echo "$tag $outname http=$code seconds=$(( $(date +%s) - t0 )) bytes=$bytes"
              if [ "$required" = 1 ]; then
                [ "$code" = 200 ] && [ "$bytes" -gt 0 ] || { echo "slice failed: $tag $outname"; docker logs "$name" 2>&1 | tail -30; docker rm -f "$name" >/dev/null; exit 1; }
              elif [ "$code" != 200 ] || [ "$bytes" -eq 0 ]; then
                rm -f "$f.gcode" "$f.hdr"
                echo "$tag $outname not accepted (http=$code); omitted"
              fi
            }
            for mat in "${want[@]}"; do
              slice_one "$mat" left "$LEFT" toe_first "${tag}_${mat}_left" 1
              slice_one "$mat" right "$RIGHT" toe_first "${tag}_${mat}_right" 1
            done
            slice_one apex_core left "$LEFT" heel_first "${tag}_apex_core_left_heel" 0
            docker rm -f "$name" >/dev/null
          done
          python3 -m pip install -q numpy scipy
          bash validation/handedness_gates/run_gates.sh "$OUT"

      - name: Upload slice and gate output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: handedness-gates-${{ github.sha }}
          path: ${{ runner.temp }}/slices
          retention-days: 14
          if-no-files-found: warn

  validation_unit:
    name: Validation scripts (no binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: 'true'
      # ubuntu-latest is 26.04 and its Python has no wheel for manifold3d
      # 2.5.1. Pip then builds it, and current scikit-build-core rejects that
      # release's cmake.minimum-version key. 3.12 has wheels for every pin.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Registry + Cura ref tests
        run: |
          python -m pip install -q -r server/requirements.txt httpx
          python validation/tests/test_server_registry.py
          python validation/tests/test_server_slice_overrides.py
          python validation/tests/test_materials.py
          python validation/tests/test_apex_light.py
          python validation/tests/test_apex_v2_insole_densities.py
          python validation/tests/test_apex_v2_cura_match.py
          python validation/tests/test_apex_v2_slice.py
          python validation/tests/test_apex_v2_gcode_bookends.py
          python validation/tests/test_first_layer_y.py
          python validation/tests/test_print_direction_tunables.py
          python validation/tests/test_belt_placement_mirror.py
          python -m unittest tests.test_server_full_chain tests.test_golden_gate tests.test_threemf_modifiers tests.test_region_infill tests.test_slice_jobs tests.test_job_store -v

  # Frozen seam-fuse gates. Additive: the jobs above are unchanged.
  # LIVE is the published server image (main). PRE-29 replaces that image's
  # server, tools, g2b scripts, validation and the three proof scripts with
  # 3717053d3c^ (parent of #29). CANDIDATE is that same LIVE image with this
  # branch's scripts/g2b_heelmod, which is the only slicer input that differs
  # from main. src/ is unchanged, so the binary matches LIVE. slice_all.sh
  # raises the gateway timeout only inside the throwaway containers.
  seam_fuse_gates:
    name: Seam-fuse gates G1 G3-G8
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'true'
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - name: Gate images and slices
        run: |
          set -euo pipefail
          LIVE="ghcr.io/kdho77/vertexslice-server@sha256:dd5127f59f5acc9674ae0bc5e48705432481db5d61f23cb8c90b4e0c0cbf1fa4"
          PRE29_SHA="3dfc95abb82d6aefbca9d2d02909b733e061a529"
          docker pull "$LIVE"
          root="$RUNNER_TEMP/seam-fuse"
          rm -rf "$root"
          mkdir -p "$root/pre29" "$root/cand"
          git archive "$PRE29_SHA" \
            server tools scripts/g2b_heelmod validation \
            scripts/golden_gate.py scripts/golden_chain_proof.py scripts/docker_headless_slice_proof.sh \
            | tar -x -C "$root/pre29"
          cp -a scripts/g2b_heelmod "$root/cand/g2b_heelmod"
          cat > "$root/pre29.Dockerfile" << 'EOF'
          FROM live-base
          COPY server /app/server
          COPY tools /app/tools
          COPY scripts/g2b_heelmod /app/scripts/g2b_heelmod
          COPY validation /app/validation
          COPY scripts/golden_gate.py /app/scripts/golden_gate.py
          COPY scripts/golden_chain_proof.py /app/scripts/golden_chain_proof.py
          COPY scripts/docker_headless_slice_proof.sh /app/scripts/docker_headless_slice_proof.sh
          EOF
          sed -i 's/^          //' "$root/pre29.Dockerfile"
          docker tag "$LIVE" live-base
          docker build -f "$root/pre29.Dockerfile" -t vertexslice-server:pre29 "$root/pre29"
          cat > "$root/cand.Dockerfile" << 'EOF'
          FROM live-base
          COPY g2b_heelmod /app/scripts/g2b_heelmod
          EOF
          sed -i 's/^          //' "$root/cand.Dockerfile"
          docker build -f "$root/cand.Dockerfile" -t vertexslice-server:cand "$root/cand"
          python3 -m pip install -q numpy
          mkdir -p "$RUNNER_TEMP/slices"
          bash validation/seam_fuse_gates/slice_all.sh "$RUNNER_TEMP/slices" \
            "live=$LIVE" \
            "pre29=vertexslice-server:pre29" \
            "cand=vertexslice-server:cand"
          bash validation/seam_fuse_gates/run_gates.sh "$RUNNER_TEMP/slices" \
            "6d01dff5b6a174ec37468671579ee7d3bbafb230" \
            "${{ github.sha }}"

      - name: Upload slice and gate output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: seam-fuse-gates-${{ github.sha }}
          path: |
            ${{ runner.temp }}/slices
          retention-days: 14
          if-no-files-found: error

      - name: Upload candidate ApexCore G-code
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cand-apex-core-gcode-${{ github.sha }}
          path: |
            ${{ runner.temp }}/slices/cand_apex_core_orthocad.gcode
            ${{ runner.temp }}/slices/cand_apex_core_insole2.gcode
          retention-days: 14
          if-no-files-found: error
