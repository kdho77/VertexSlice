# VertexSlice-branded Windows build artifact (manual / release candidate).
# Does not auto-run on every push — use workflow_dispatch from the branch under test.
name: Windows VertexSlice artifact

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA)
        required: true
        default: cursor/headless-server-20b4
      force-deps:
        description: Rebuild Windows dependencies even if cache hits
        type: boolean
        default: false

concurrency:
  group: windows-vertexslice-${{ github.event.inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_windows:
    name: Build Windows x64 VertexSlice
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}
          lfs: "true"

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - name: Setup MSBuild (VS 2022)
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: "[17.0,18.0)"

      - name: Compute deps cache key
        id: deps-key
        shell: bash
        run: |
          echo "key=deps-$(git rev-parse HEAD:deps)-$(git rev-parse HEAD:deps_src)" >> "$GITHUB_OUTPUT"

      - name: Cache deps prefix
        uses: actions/cache@v4
        with:
          path: deps/build
          key: ${{ steps.deps-key.outputs.key }}
          restore-keys: |
            deps-

      - name: Build release (VS2022)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ inputs.force-deps }}' -eq 'true') { $env:FORCE_DEPS = '1' }
          .\build_release_vs2022.bat

      - name: Package VertexSlice installer + portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (Get-Date -Format 'yyyyMMdd')
          New-Item -ItemType Directory -Force -Path release | Out-Null
          "ref=${{ github.event.inputs.ref }}" | Set-Content release\VERTEXSLICE_BUILD.txt
          "sha=$env:GITHUB_SHA" | Add-Content release\VERTEXSLICE_BUILD.txt
          $exes = Get-ChildItem -Path build -Filter '*Slicer*.exe' -File -ErrorAction SilentlyContinue
          if (-not $exes) { $exes = Get-ChildItem -Path build -Filter 'ShidaoSlicer*.exe' -File }
          if (-not $exes) { throw "No installer exe in build/" }
          foreach ($exe in $exes) {
            Copy-Item $exe.FullName "release\VertexSlice_$ver$($exe.Extension)"
          }
          if (-not (Test-Path 'build\OrcaSlicer')) { throw "build/OrcaSlicer missing" }
          $portable = "release\VertexSlice_Windows_${ver}_portable.zip"
          if (Test-Path 'C:\Program Files\7-Zip\7z.exe') {
            & 'C:\Program Files\7-Zip\7z.exe' a -tzip $portable '.\build\OrcaSlicer\*'
          } else {
            Compress-Archive -Path 'build\OrcaSlicer\*' -DestinationPath $portable
          }

      - name: Upload VertexSlice Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: VertexSlice_Windows_${{ github.run_id }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
