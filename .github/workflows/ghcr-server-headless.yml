# Build Dockerfile.server and publish to GHCR for Railway (prebuilt image).
name: GHCR headless slicer image

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/headless-server-20b4
    paths:
      - 'Dockerfile.server'
      - 'server/**'
      - 'src/**'
      - 'deps/**'
      - 'resources/profiles/IdeaFormer/**'
      - 'scripts/docker_headless_slice_proof.sh'
      - '.github/workflows/ghcr-server-headless.yml'

concurrency:
  group: ghcr-server-headless-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kdho77/vertexslice-server

jobs:
  build_push:
    name: Build and push vertexslice-server
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: "true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          build-args: |
            SKIP_DOCKER_SLICE_PROOF=1
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:headless
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=vertexslice-server-headless
          cache-to: type=gha,mode=max,scope=vertexslice-server-headless

      - name: Image digest
        run: |
          echo "digest=${{ steps.build.outputs.digest }}"
          echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:headless"

      - name: Make package public (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/vertexslice-server/visibility" \
            -f visibility='public' \
            && echo "Package visibility set to public" \
            || echo "Could not set public visibility (may need admin token or already public)"

  smoke:
    name: Smoke test pushed image
    needs: build_push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (STL for slice test)
        uses: actions/checkout@v6
        with:
          lfs: "true"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ghcr.io/kdho77/vertexslice-server:headless

      - name: Health check
        run: |
          cid=$(docker run -d -p 18080:8080 ghcr.io/kdho77/vertexslice-server:headless)
          trap "docker rm -f $cid" EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/health | grep -q '"status":"ok"'; then
              echo "health ok"
              exit 0
            fi
            sleep 2
          done
          docker logs "$cid"
          exit 1

      - name: Slice OrthoCAD STL via API
        timeout-minutes: 20
        run: |
          cid=$(docker run -d -p 18081:8080 \
            -e QT_QPA_PLATFORM=offscreen \
            -e LIBGL_ALWAYS_SOFTWARE=1 \
            ghcr.io/kdho77/vertexslice-server:headless)
          trap "docker rm -f $cid" EXIT
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:18081/health >/dev/null && break
            sleep 2
          done
          curl -sf -X POST http://127.0.0.1:18081/v1/slice \
            -F profile_id=apex-v2-insole-medium \
            -F wall_loops=1 \
            -F infill_density=26 \
            -F print_direction=toe_first \
            -F belt_insole_place=true \
            -F model=@validation/test_models/orthocad_sample_top_insole.stl \
            -o /tmp/out.gcode
          head -n 40 /tmp/out.gcode
          grep -q PRINT_START /tmp/out.gcode
