name: Check profiles
on: 
  pull_request:
    branches: 
    - main 
    paths:
    - 'resources/profiles/**'
    - ".github/workflows/check_profiles.yml"

  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'     
        required: true
        default: 'warning'


jobs:
  check_translation:
    name: Check profiles
    runs-on: ubuntu-24.04
    steps:  
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run extra JSON check
        run: |
          python3 ./scripts/orca_extra_profile_check.py

      # download
      - name: Download 
        working-directory: ${{ github.workspace }}
        run: |
          curl -LJO https://github.com/SoftFever/Orca_tools/releases/download/1/OrcaSlicer_profile_validator
          chmod +x ./OrcaSlicer_profile_validator

      # validate profiles
      # Upstream SoftFever binary does not know printer_structure=belt (this fork).
      # Wrapper remaps that enum in a temp copy only; real presets stay belt.
      # -v IdeaFormer: this fork's vendor. Other bundled vendors fail the newer
      # upstream printer_variant rules independently of belt.
      - name: validate system profiles
        run: |
          python3 ./scripts/run_orca_profile_validator.py ./OrcaSlicer_profile_validator \
            -p ${{ github.workspace }}/resources/profiles -v IdeaFormer -l 2

      # Skip Orca's stock user-preset zip. Those tests inherit BBL/Creality/etc.
      # parents; this job only loads IdeaFormer (+ OrcaFilamentLibrary), so the
      # zip produces thousands of "can not find parent" errors. No IdeaFormer
      # custom-preset fixture is shipped with the zip.
      - name: validate custom presets
        run: |
          echo "Skipping stock orca_custom_preset_tests.zip (not applicable to IdeaFormer-only validation)."




